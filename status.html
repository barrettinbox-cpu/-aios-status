<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta http-equiv="refresh" content="60"/>
<title>AIOS queue status</title>
<style>
  :root { color-scheme: light dark; --ok:#1a7f37; --deg:#9a6700; --bad:#cf222e; --muted:#656d76; --card:#f6f8fa; --border:#d0d7de; }
  @media (prefers-color-scheme: dark) {
    :root { --card:#161b22; --border:#30363d; --muted:#8b949e; }
  }
  body { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
         margin: 0; padding: 1.25rem; line-height: 1.45; max-width: 42rem; }
  h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
  .verdict { display:inline-block; font-weight:700; padding:.2rem .55rem; border-radius:999px; border:1px solid var(--border); }
  .ok { color: var(--ok); } .deg { color: var(--deg); } .bad { color: var(--bad); }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: .9rem 1rem; margin: .75rem 0; }
  .muted { color: var(--muted); font-size: .85rem; }
  .grid { display:grid; grid-template-columns: 1fr 1fr; gap: .5rem .75rem; }
  .k { color: var(--muted); font-size: .8rem; } .v { font-weight: 600; }
  ul { margin: .4rem 0 0 1.1rem; padding: 0; }
  code { font-size: .8rem; word-break: break-all; }
  a { color: inherit; }
</style>
</head>
<body>
  <h1>AIOS queue status</h1>
  <p class="muted">Live public read of CPI-08 published health. Auto-refreshes every 60s. No secrets.</p>
  <div id="root" class="card">Loading…</div>
  <p class="muted">Source: <code id="src"></code></p>
<script>
(function () {
  var SRC = 'https://raw.githubusercontent.com/barrettinbox-cpu/-aios-status/main/queue-health.json';
  document.getElementById('src').textContent = SRC;
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]);
    });
  }
  function age(iso) {
    if (!iso) return '?';
    var sec = Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 1000));
    if (sec < 90) return sec + 's';
    if (sec < 3600) return Math.round(sec/60) + 'm';
    return (sec/3600).toFixed(1) + 'h';
  }
  function cls(v) {
    v = String(v || '').toUpperCase();
    if (v === 'OK' || v === 'HEALTHY' || v === 'PASS') return 'ok';
    if (v === 'DEGRADED' || v === 'WARN') return 'deg';
    return 'bad';
  }
  function render(j) {
    var q = j.queue || {};
    var p = j.providers || {};
    var problems = (j.problems || []).map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') || '<li class="muted">none</li>';
    var prov = Object.keys(p).map(function (k) {
      var s = p[k] || {};
      return '<div><div class="k">' + esc(k) + '</div><div class="v ' + cls(s.state) + '">' + esc(s.state || '?') + (s.admissible === false ? ' (not admissible)' : '') + '</div></div>';
    }).join('');
    var stale = '';
    try {
      var a = Math.round((Date.now() - Date.parse(j.generated_at_utc)) / 1000);
      if (j.stale_after_seconds && a > j.stale_after_seconds) stale = ' · STALE';
    } catch (e) {}
    document.getElementById('root').innerHTML =
      '<div><span class="verdict ' + cls(j.verdict) + '">' + esc(j.verdict || '?') + '</span>' +
      '<span class="muted"> · seq ' + esc(j.sequence) + ' · age ' + esc(age(j.generated_at_utc)) + stale + '</span></div>' +
      '<p style="margin:.75rem 0 .25rem"><strong>Problems</strong></p><ul>' + problems + '</ul>' +
      '<p style="margin:.9rem 0 .35rem"><strong>Queue</strong></p>' +
      '<div class="grid">' +
        '<div><div class="k">Ready</div><div class="v">' + esc(q.ready) + '</div></div>' +
        '<div><div class="k">Running</div><div class="v">' + esc(q.running) + '</div></div>' +
        '<div><div class="k">Claimable now</div><div class="v">' + esc(q.claimable_now) + '</div></div>' +
        '<div><div class="k">Dependency wait</div><div class="v">' + esc(q.dependency_wait) + '</div></div>' +
        '<div><div class="k">Done</div><div class="v">' + esc(q.done) + '</div></div>' +
        '<div><div class="k">Draft / Failed</div><div class="v">' + esc(q.draft) + ' / ' + esc(q.failed) + '</div></div>' +
      '</div>' +
      '<p style="margin:.9rem 0 .35rem"><strong>Providers</strong></p><div class="grid">' + prov + '</div>' +
      '<p class="muted" style="margin-top:.9rem">generated ' + esc(j.generated_at_utc) +
      ' · published ' + esc(j.published_at_utc) + '</p>';
  }
  function fail(msg) {
    document.getElementById('root').innerHTML = '<p class="bad"><strong>Could not load status</strong></p><p class="muted">' + esc(msg) + '</p>';
  }
  fetch(SRC + '?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(render)
    .catch(function (e) { fail(e && e.message ? e.message : String(e)); });
})();
</script>
</body>
</html>
